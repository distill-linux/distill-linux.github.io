<!DOCTYPE HTML>
<html>
<head>
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "style.css" | relURL }}" type="text/css" media="screen">
    <link rel="shortcut icon" href="{{ "favicon.ico" | relURL }}" type="image/vnd.microsoft.icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script>
        (function() {
            if (localStorage.getItem('distill-inverted') === 'true') {
                document.documentElement.classList.add('inverted');
            }
        })();
        function toggleInvert() {
            var isInv = document.documentElement.classList.toggle('inverted');
            try {
                localStorage.setItem('distill-inverted', isInv ? 'true' : 'false');
            } catch (e) {}
        }
    </script>
</head>
<body>
<header>
    <nav>
        <div>
        {{- range $index, $element := .Site.Menus.top }}
            {{- if gt $index 0 }} | {{ end }}<a href="{{ $element.URL }}">{{ $element.Name }}</a>
        {{- end }} | <a href="javascript:void(0)" onclick="toggleInvert()" id="invert-toggle" title="Invert colors">invert</a>
        </div>
    </nav>
    <h1><a href="/">distill <span id="headerSubTitle">{{ .Site.Params.tagline }}</span></a></h1>
</header>

<nav id="side-bar">
    <div>
        <p class="sideBarTitle">pages:</p>
        <ul>
            {{- range .Site.Menus.sidebar -}}
            <li><a href="{{ .URL }}">&rsaquo; {{ .Name }}</a></li>
            {{- end -}}
        </ul>
    </div>
</nav>

<article>
{{ block "main" . }}{{ end }}
</article>

<footer>
</footer>
</body>
</html>
